<body>
<div class="app" id="app"></div>

<div class="timer" id="timer" role="status" aria-live="polite">
  <div>
    <div class="eyebrow" id="timerLbl">Pause</div>
    <div class="t num" id="timerT">1:00</div>
  </div>
  <div class="bar"><i id="timerBar"></i></div>
  <button class="btn sm" id="tMinus" type="button">−15 s</button>
  <button class="btn sm" id="tPlus" type="button">+15 s</button>
  <button class="btn sm ghost" id="tStop" type="button" aria-label="Timer stoppen">✕</button>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<nav class="tabs" aria-label="Hauptnavigation"><div class="in">
  <a href="#training" data-tab="training"><svg viewBox="0 0 24 24"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>Training</a>

  <a href="#fortschritt" data-tab="fortschritt"><svg viewBox="0 0 24 24"><path d="M4 19l5-6 4 3 7-9"/><path d="M15 7h5v5"/></svg>Fortschritt</a>
